plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fifo.juliancalculator'
    compileSdk 35
    buildToolsVersion '35.0.0'

    signingConfigs {
        debug {
            storeFile file("$rootDir/fifo-debug.keystore")
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.fifo.juliancalculator'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '1.4-experimental.4'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}
